<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jul1o Informática | Catálogo</title>
  <meta name="description" content="Catálogo de peças e periféricos da Jul1o Informática. Veja o que tem em estoque e chame no WhatsApp.">
  <meta name="theme-color" content="#0a0a0c">

  <!-- Prévia ao compartilhar o link (WhatsApp, Instagram, etc.)
       A imagem precisa do endereço completo do site, senão as redes sociais não mostram. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://julioinformaticagvt.github.io/catalogo/">
  <meta property="og:title" content="Jul1o Informática | Catálogo">
  <meta property="og:description" content="Peças e periféricos para o seu PC. Veja o que tem em estoque e chame no WhatsApp.">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:image" content="https://julioinformaticagvt.github.io/catalogo/img/og.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#produtos">Ir para os produtos</a>

  <header class="top">
    <div class="wrap top-in">
      <a class="brand" href="./" aria-label="Júlio Informática, início">
        <img src="img/logo.png" alt="Júlio Informática" width="1038" height="466">
      </a>
      <!-- O logo do WhatsApp dos botões é colocado pelo js/app.js (ICONE_WA) -->
      <a class="btn primary sm" id="top-wa" href="#" target="_blank" rel="noopener">
        <span>WhatsApp</span>
      </a>
    </div>
  </header>

  <section class="hero">
    <div class="wrap">
      <h1 class="logo-glitch">
        <img class="base" src="img/logo.png" alt="Júlio Informática" width="1038" height="466" fetchpriority="high">
        <img class="g g1" src="img/logo.png" alt="" aria-hidden="true">
        <img class="g g2" src="img/logo.png" alt="" aria-hidden="true">
      </h1>
      <p class="tagline" id="hero-titulo">Peças e periféricos para o seu PC</p>
      <p class="lead" id="hero-sub"></p>
      <div class="hero-actions">
        <a class="btn primary" href="#produtos">Ver produtos</a>
        <a class="btn ghost" id="hero-wa" href="#" target="_blank" rel="noopener"><span>Falar no WhatsApp</span></a>
      </div>
      <p class="hero-note" id="hero-note"></p>
    </div>
  </section>

  <section class="passos" id="passos-sec" hidden aria-label="Como funciona">
    <div class="wrap">
      <ol id="passos-lista"></ol>
    </div>
  </section>

  <div class="toolbar" id="toolbar">
    <div class="wrap">
      <label class="search">
        <svg class="ico target" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="sr">Buscar produto</span>
        <input id="busca" type="search" placeholder="Buscar por nome, marca ou categoria" autocomplete="off" enterkeyhint="search">
        <button type="button" class="clear" id="busca-limpar" aria-label="Limpar busca" hidden>&times;</button>
      </label>
      <div class="chips" id="chips" role="group" aria-label="Categorias"></div>
    </div>
  </div>

  <main class="wrap" id="produtos">
    <div class="meta">
      <p class="count" id="contagem" aria-live="polite"></p>
      <div class="controls">
        <label class="check">
          <input type="checkbox" id="so-disp">
          <span>Só disponíveis</span>
        </label>
        <label class="sort">
          <span class="sr">Ordenar</span>
          <select id="ordem">
            <option value="destaque">Em destaque</option>
            <option value="disp">Disponíveis primeiro</option>
            <option value="az">Nome (A-Z)</option>
          </select>
        </label>
      </div>
    </div>

    <p class="price-note" id="aviso-preco"></p>

    <div class="grid" id="grid"></div>

    <div class="empty" id="vazio" hidden>
      <h2 id="vazio-titulo">Nenhum produto encontrado</h2>
      <p id="vazio-texto">Tente outra palavra ou outra categoria. Se não achou, pergunte direto para a gente.</p>
      <a class="btn primary" id="vazio-wa" href="#" target="_blank" rel="noopener"><span>Perguntar no WhatsApp</span></a>
    </div>
  </main>

  <section class="servicos" id="servicos-sec" hidden>
    <div class="wrap">
      <h2>Também fazemos</h2>
      <ul id="servicos-lista"></ul>
    </div>
  </section>

  <footer class="foot">
    <div class="wrap foot-in">
      <img class="foot-logo" src="img/logo.png" alt="" width="1038" height="466" loading="lazy">
      <p class="foot-info" id="foot-info"></p>
      <p class="foot-upd" id="foot-upd"></p>
    </div>
  </footer>

  <a class="fab" id="fab" href="#" target="_blank" rel="noopener" aria-label="Chamar no WhatsApp"></a>

  <button type="button" class="topo" id="topo" aria-label="Voltar ao topo" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <button type="button" class="lista-bar" id="lista-bar" hidden>
    <span class="lb-txt">Minha lista de interesse</span>
    <span class="lb-num" id="lista-num">0</span>
    <span class="lb-cta">Ver lista</span>
  </button>

  <dialog id="modal" aria-labelledby="m-titulo">
    <div class="m-in" id="modal-conteudo"></div>
  </dialog>

  <dialog id="lista-dlg" aria-labelledby="l-titulo">
    <div class="l-in" id="lista-conteudo"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/config.js"></script>
  <script src="dados/produtos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
